# ==================== DISCORD MESSAGES ====================
# These are used in Discord embeds and messages
# You can use server emojis: <:emojiname:emojiid>
# You can use animated emojis: <a:emojiname:emojiid>
# Standard Discord emojis also work: :skull: :trophy: etc.
#
# How to get emoji ID:
# Type \:emojiname: in Discord chat
# It will show <:emojiname:123456789> - copy the full format

discord:
  # Server status
  server-start: "Server is now **online**! :green_circle:"
  server-stop: "Server is now **offline**. :red_circle:"

  # Player events
  player-join: "**%player%** joined the server"
  player-leave: "**%player%** left the server"
  player-death: ":skull: %message%"
  player-advancement: ":trophy: **%player%** has made the advancement **%advancement%**"

  # Discord to Minecraft chat format
  discord-to-mc: "&9[Discord] &b%player% &f> &f%message%"

  # Command verification embeds
  verify-title: "Command Verification"
  verify-description: ""
  verify-approved-title: "Approved"
  verify-denied-title: "Denied"
  verify-expired-msg: "Expired or already processed."

  # Staff 2FA embeds
  staff-2fa-title: "Staff 2FA Verification"
  staff-2fa-description: "Login detected for your staff account."
  staff-2fa-verified-title: "Verified"
  staff-2fa-denied-title: "Denied"

  # Player 2FA embeds
  player-2fa-title: "Login Verification"
  player-2fa-description: "A login was detected for your linked account."
  player-2fa-verified-title: "Verified"
  player-2fa-verified-description: "You can now play on the server."
  player-2fa-denied-title: "Denied"
  player-2fa-denied-description: "Login denied. Player kicked."

  # Link embeds
  link-success-title: "Account Linked!"
  link-log-title: "New Account Link"
  link-invalid-code: "Invalid or expired code!"

  # Command log
  cmd-log-player-label: "Player"
  cmd-log-command-label: "Command"

  # VPN log
  vpn-title: "VPN/Proxy Detected"
  vpn-player-label: "Player"
  vpn-ip-label: "IP"
  vpn-reason-label: "Reason"

  # Console
  console-executed: "[Executed]"
  console-pending: "[Pending]"

  # IP response
  ip-title: "Server Information"

  # Online players
  online-title: "Online Players"
  online-no-players: "No players online."
  online-footer: "Online: %online%/%max%"

  # Button labels
  btn-approve: "Approve"
  btn-deny: "Deny"
  btn-verify: "Verify"
  btn-deny-2fa: "Deny (Not Me!)"
